  if(sit){L.ll.rotation.x=L.rl.rotation.x=-1.45;L.la.rotation.x=L.ra.rotation.x=-.4;}
  else if(air){L.ll.rotation.x=-.45;L.rl.rotation.x=.35;L.la.rotation.z=-.6;L.ra.rotation.z=.6;}
  else if(mv){L.ll.rotation.x=Math.sin(t)*.68;L.rl.rotation.x=-Math.sin(t)*.68;L.la.rotation.x=-Math.sin(t)*.58;L.ra.rotation.x=Math.sin(t)*.58;}
  else{L.bd.position.y=Math.sin(t*2.4)*.02;L.hd.rotation.y=Math.sin(t*.8)*.18;}
  if(e==='wave'){L.ra.rotation.z=2.7;L.ra.rotation.x=Math.sin(t*14)*.35;}
  else if(e==='dance'){L.bd.position.y=Math.abs(Math.sin(t*9))*.14;L.bd.rotation.z=Math.sin(t*4.5)*.16;L.la.rotation.z=-2.2;L.ra.rotation.z=2.2;}
  else if(e==='cheer'){L.la.rotation.z=-2.8;L.ra.rotation.z=2.8;}
  else if(e==='laugh')L.bd.rotation.x=-.18+Math.sin(t*18)*.08;

  else if(e==='love'){L.la.rotation.x=L.ra.rotation.x=-1.1;}
}

}
function spin(){if(S.cash<100)return;S.cash-=100;const y=['🍒','💎','7️⃣'],r=[0,1,2].map(()=>y[Math.floor(Math.random()*3)]);document.getElementById('sr').innerText=r.join(' ');if(r[0]===r[1]&&r[1]===r[2]){S.cash+=500;emote('dance');toast('🎰 +$500!');}else if(r[0]===r[1]||r[1]===r[2]){S.cash+=180;emote('cheer');toast('🎰 +$180');}else emote('angry');save();upd();}
function uc(){const c=document.getElementById('pi').value.trim().toUpperCase();if(S.codes.includes(c))return;if(c==='ADMIN2026'){S.cash=S.bank=999999999;S.xp=999999;if(!S.skins.includes('adm'))S.skins.push('adm');S.skin='adm';rbPl();emote('dance');toast('👑 АДМИН АКТИВИРОВАН!');}else if(c==='XMAS2026'){if(!S.skins.includes('xmas'))S.skins.push('xmas');S.skin='xmas';rbPl();toast('🎅 Новогодний скин получен!');}else if(c==='START2026'){S.cash+=1500;toast('🎁 +$1500');}else if(c==='CRYPTOVIP'){S.mtc+=5;toast('🎁 +5 MTC');}else if(c==='MEGA10K'){S.cash+=10000;toast('🎁 +$10000');}else return toast('❌ Неверный код');S.codes.push(c);save();upd();document.getElementById('md').style.display='none';}
function ub(i){const it=S.bag[i];if(it.id==='fix'){S.chp=S.fuel=100;toast('🔧 Авто отремонтировано!');}else{if(it.en)S.en=Math.min(100,S.en+it.en);if(it.hp)S.hp=Math.min(100,S.hp+it.hp);}if(--it.cnt<=0)S.bag.splice(i,1);emote('love');save();upd();openM('bag');}
async function lg(){const u=document.getElementById('ul').value.trim();if(!u)return;S.user=u;save();upd();try{const r=await fetch('https://keyvalue.immanuel.co/api/KeyVal/GetValue/ns3d_'+encodeURIComponent(u)),tx=await r.text();if(tx&&tx.length>10){const cl=JSON.parse(JSON.parse(tx));if(cl.pts>S.pts){S={...S,...cl};rbPl();rbCar();rbHeli();rbPet();}}await fetch('https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/ns3d_'+encodeURIComponent(u)+'/'+encodeURIComponent(JSON.stringify(S)),{method:'POST'});toast('☁️ Облако синхронизировано!');}catch(e){toast('💾 Сохранено локально');}document.getElementById('md').style.display='none';}

buildCity();rbPl();rbPet();rbCar();rbHeli();pl.position.set(S.px,0,S.pz);car.position.set(S.cx,0,S.cz);car.rotation.y=S.cr;heli.position.set(S.hx,S.hy,S.hz);pet.position.copy(pl.position);upd();
if(isJailed())enterIn('prs');
setInterval(()=>{if(loc==='city'){S.px=pl.position.x;S.pz=pl.position.z;}S.cx=car.position.x;S.cz=car.position.z;S.cr=car.rotation.y;save();},10000);
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rn.setSize(innerWidth,innerHeight);};
let lt=performance.now();(function lp(nw){requestAnimationFrame(lp);const dt=Math.min(.05,(nw-lt)/1000);lt=nw;updP(dt);drawMM();rn.render(sc,cam);})(lt);
</script>
